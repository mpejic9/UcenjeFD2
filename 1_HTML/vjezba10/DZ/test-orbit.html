<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <title>Orbit Test</title>

  <!-- Foundation CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/css/foundation.min.css">

  <style>
    body { padding: 40px; }
    .orbit img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>

<div class="orbit" role="region" aria-label="Test Slider" data-orbit data-use-m-u-i="false">
  <div class="orbit-wrapper">
    <div class="orbit-controls">
      <button class="orbit-previous">&#9664;</button>
      <button class="orbit-next">&#9654;</button>
    </div>

    <ul class="orbit-container">
      <li class="is-active orbit-slide">
        <img src="https://picsum.photos/id/1015/800/400">
      </li>
      <li class="orbit-slide">
        <img src="https://picsum.photos/id/1025/800/400">
      </li>
      <li class="orbit-slide">
        <img src="https://picsum.photos/id/1035/800/400">
      </li>
    </ul>
  </div>

  <nav class="orbit-bullets">
    <button class="is-active"></button>
    <button></button>
    <button></button>
  </nav>
</div>

<!-- jQuery -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<!-- Foundation JS -->
<script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.7.5/dist/js/foundation.min.js"></script>

<script>
  $(function() {
    $(document).foundation();
  });
</script>

</body>
</html>
